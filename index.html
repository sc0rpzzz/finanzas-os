<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Finanzas OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Tailwind Play CDN: ideal para arrancar sin build. Más adelante se puede compilar con la CLI. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'] } } } };
  </script>
  <style>
    body { background: #020617; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
    .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 0.5rem); }
    .safe-t { padding-top: env(safe-area-inset-top); }
    dialog::backdrop { background: rgb(2 6 23 / .8); }
    .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } * { transition: none !important; } }
  </style>
  <script src="config.js?v=13"></script>
</head>
<body class="min-h-screen font-sans antialiased">
  <div id="splash" class="fixed inset-0 z-[60] flex flex-col items-center justify-center gap-5 bg-slate-950 transition-opacity duration-300" role="status" aria-label="Cargando Finanzas OS">
    <p class="text-3xl font-semibold tracking-tight">Finanzas <span class="text-emerald-400">OS</span></p>
    <div class="h-1 w-40 overflow-hidden rounded-full bg-slate-800"><div class="h-full w-1/3 animate-pulse rounded-full bg-emerald-400"></div></div>
    <p class="text-xs text-slate-500">Preparando tus datos…</p>
  </div>
  <div id="busy" class="hidden fixed inset-x-0 top-0 z-50 h-0.5 animate-pulse bg-emerald-400" role="progressbar" aria-label="Actualizando"></div>
  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/90 backdrop-blur safe-t md:hidden">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-2 px-4 py-3 md:max-w-6xl md:px-8">
      <h1 class="text-lg font-semibold tracking-tight md:hidden">Finanzas <span class="text-emerald-400">OS</span></h1>
      <div class="flex items-center gap-2 md:ml-auto">
        <button data-act="yape" type="button"
          class="inline-flex items-center gap-2 rounded-lg bg-violet-600 px-3 py-2 text-sm font-medium text-white hover:bg-violet-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-300 disabled:opacity-50">
          <span data-icon="refresh"></span> Sincronizar Yape
        </button>
        <button data-act="logout" type="button" aria-label="Cerrar sesión"
          class="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400">
          <span data-icon="logout"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="md:pl-56"><main id="view" class="mx-auto max-w-3xl px-4 pb-28 pt-4 md:max-w-6xl md:px-8 md:pb-10" aria-live="polite"></main></div>

  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-800 bg-slate-950/95 backdrop-blur safe-b md:inset-y-0 md:right-auto md:flex md:w-56 md:flex-col md:border-r md:border-t-0 md:pb-0" aria-label="Secciones">
    <div class="hidden px-6 py-4 text-lg font-semibold tracking-tight md:block">Finanzas <span class="text-emerald-400">OS</span></div>
    <div class="mx-auto grid max-w-3xl grid-cols-6 md:flex md:max-w-none md:flex-col md:gap-1 md:px-3">
      <a href="#inbox" data-nav="inbox" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="inbox"></span>Inbox</a>
      <a href="#tarjetas" data-nav="tarjetas" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="card"></span>Tarjetas</a>
      <a href="#movimientos" data-nav="movimientos" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="table"></span><span class="md:hidden">Movs.</span><span class="hidden md:inline">Movimientos</span></a>
      <a href="#calendario" data-nav="calendario" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="calendar"></span>Cuotas</a>
      <a href="#resumen" data-nav="resumen" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="chart"></span>Resumen</a>
      <a href="#categorias" data-nav="categorias" class="flex flex-col items-center gap-1 py-2 text-[11px] text-slate-400 sm:text-xs md:flex-row md:gap-3 md:rounded-lg md:px-3 md:py-2.5 md:text-sm md:hover:bg-slate-800"><span data-icon="tag"></span><span class="md:hidden">Categ.</span><span class="hidden md:inline">Categorías</span></a>
    </div>
    <div class="mt-auto hidden flex-col gap-2 border-t border-slate-800 p-3 md:flex">
      <button data-act="yape" type="button"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-violet-600 px-3 py-2 text-sm font-medium text-white hover:bg-violet-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-300 disabled:opacity-50">
        <span data-icon="refresh"></span> Sincronizar Yape
      </button>
      <button data-act="logout" type="button"
        class="inline-flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400">
        <span data-icon="logout"></span> Cerrar sesión
      </button>
    </div>
  </nav>

  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed inset-x-4 bottom-24 z-50 mx-auto hidden max-w-sm rounded-xl border px-4 py-3 text-sm shadow-lg"></div>

  <dialog id="setup" class="w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-0 text-slate-100">
    <form id="setup-form" class="space-y-4 p-6" autocomplete="off">
      <div>
        <h2 class="text-lg font-semibold">Conectar con tu API</h2>
        <p class="mt-1 text-sm text-slate-400">Se guardan solo en este dispositivo (localStorage).</p>
      </div>
      <label class="block text-sm">URL de la Web App
        <input id="setup-url" type="url" required inputmode="url" placeholder="https://script.google.com/macros/s/…/exec"
          class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-400 focus:outline-none focus:ring-1 focus:ring-emerald-400">
      </label>
      <label class="block text-sm">Token de seguridad
        <input id="setup-token" type="password" required minlength="24" autocomplete="off" autocapitalize="off" spellcheck="false"
          class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-400 focus:outline-none focus:ring-1 focus:ring-emerald-400">
      </label>
      <p id="setup-error" class="hidden rounded-lg border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-sm text-rose-200"></p>
      <button id="setup-submit" type="submit"
        class="w-full rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-200 disabled:opacity-50">
        Verificar y guardar
      </button>
    </form>
  </dialog>

  <script src="app.js?v=18" defer></script>
</body>
</html>
